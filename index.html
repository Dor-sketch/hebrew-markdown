    <style>
        :root {
            /* Modern color palette - enhanced */
            --background: #ffffff;
            --surface-1: #f7f9fc;
            --surface-2: #eef2f7;
            --card: #ffffff;
            --primary: #0066ff;
            --primary-light: #e6f0ff;
            --primary-dark: #0055d4;
            --secondary: #5d5cd6;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-tertiary: #a1a1a6;
            --border: #d2d2d7;
            --divider: #e5e5ea;
            --accent-red: #ff3b30;
            --accent-orange: #ff9500;
            --accent-yellow: #ffcc00;
            --accent-green: #34c759;
            --accent-blue: #5ac8fa;
            --accent-indigo: #5856d6;
            --accent-purple: #af52de;

            /* Typography */
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial Hebrew', Arial, sans-serif;
            --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;

            /* Spacing */
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-2xl: 48px;

            /* Sizing */
            --border-radius-sm: 6px;
            --border-radius-md: 8px;
            --border-radius-lg: 12px;
            --border-radius-xl: 16px;

            /* Shadows - enhanced */
            --shadow-sm: 0px 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0px 4px 8px rgba(0, 0, 0, 0.03), 0px 2px 4px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0px 12px 24px rgba(0, 0, 0, 0.05), 0px 4px 6px rgba(0, 0, 0, 0.03);
            --shadow-focus: 0 0 0 3px rgba(0, 102, 255, 0.3);
            --shadow-card: 0px 10px 20px rgba(0, 0, 0, 0.04), 0px 2px 6px rgba(0, 0, 0, 0.02);

            /* Animation */
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.35s cubic-bezier(0.4, 0, 0.2, 1);

            /* Editor modes */
            --editor-width: 50%;
            --preview-width: 50%;
        }

        /* Dark mode colors - enhanced */
        [data-theme="dark"] {
            --background: #111111;
            --surface-1: #1e1e1e;
            --surface-2: #2a2a2a;
            --card: #2c2c2c;
            --primary: #1a8cff;
            --primary-light: #153b6b;
            --primary-dark: #409cff;
            --secondary: #6e6aef;
            --text-primary: #f5f5f7;
            --text-secondary: #babac0;
            --text-tertiary: #757578;
            --border: #3a3a3c;
            --divider: #38383a;
            --accent-red: #ff453a;
            --accent-orange: #ff9f0a;
            --accent-yellow: #ffd60a;
            --accent-green: #32d74b;
            --accent-blue: #64d2ff;
            --accent-indigo: #5e5ce6;
            --accent-purple: #bf5af2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.5;
            height: 100vh;
            transition: background-color var(--transition-normal), color var(--transition-normal);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header - Clean and minimal - enhanced */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-md) var(--spacing-lg);
            background-color: var(--card);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: background-color var(--transition-normal);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 20;
        }

        .app-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .app-title i {
            color: var(--primary);
            font-size: 1.2em;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        /* Controls group - enhanced */
        .control-group {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            background-color: var(--surface-1);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-sm);
            box-shadow: var(--shadow-sm);
            transition: transform var(--transition-fast), box-shadow var(--transition-fast);
        }

        .control-group:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        /* Modern toggle switch - enhanced */
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
            background-color: var(--surface-2);
            border-radius: 14px;
            transition: background-color var(--transition-normal);
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0 2px;
            overflow: hidden;
        }

        .toggle-switch[data-active="true"] {
            background-color: var(--primary);
        }

        .toggle-handle {
            position: absolute;
            right: 2px;
            width: 24px;
            height: 24px;
            background-color: white;
            border-radius: 50%;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            transition: transform var(--transition-normal);
            z-index: 1;
        }

        .toggle-switch[data-active="true"] .toggle-handle {
            transform: translateX(-22px);
        }

        /* Add sun and moon icons */
        .toggle-switch::before,
        .toggle-switch::after {
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            transition: opacity var(--transition-normal);
        }

        .toggle-switch::before {
            content: "\f185"; /* sun */
            right: 6px;
            color: #ffcc00;
            opacity: 1;
        }

        .toggle-switch::after {
            content: "\f186"; /* moon */
            left: 6px;
            color: #ffffff;
            opacity: 0;
        }

        .toggle-switch[data-active="true"]::before {
            opacity: 0;
        }

        .toggle-switch[data-active="true"]::after {
            opacity: 1;
        }

        .switch-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* View mode tabs - enhanced */
        .view-modes {
            display: flex;
            align-items: center;
            background-color: var(--surface-1);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-xs);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .view-mode-btn {
            border: none;
            background: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            padding: 6px var(--spacing-md);
            border-radius: var(--border-radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .view-mode-btn:hover {
            color: var(--text-primary);
            background-color: var(--surface-2);
        }

        .view-mode-btn.active {
            color: white;
            background-color: var(--primary);
        }

        .view-mode-btn i {
            font-size: 0.95em;
        }

        /* Theme selector - enhanced */
        .theme-selector {
            position: relative;
        }

        .theme-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            background-color: var(--card);
            border-radius: var(--border-radius-md);
            box-shadow: var(--shadow-lg);
            padding: var(--spacing-sm);
            margin-top: var(--spacing-sm);
            display: none;
            z-index: 30;
            min-width: 200px;
            max-width: 260px;
            overflow-y: auto;
            max-height: 400px;
            border: 1px solid var(--border);
        }

        .theme-selector.open .theme-dropdown {
            display: block;
            animation: fadeIn 0.2s ease-out;
        }

        .theme-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: background-color var(--transition-fast);
            margin-bottom: 2px;
        }

        .theme-option:hover {
            background-color: var(--surface-1);
        }

        .theme-option.active {
            background-color: var(--primary-light);
            color: var(--primary);
            font-weight: 500;
        }

        .theme-option.active::after {
            content: "\f00c";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: var(--primary);
            font-size: 0.9em;
        }

        .theme-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            margin-left: var(--spacing-sm);
        }

        /* Toolbar - Minimal and clean - enhanced */
        .toolbar {
            display: flex;
            align-items: center;
            padding: var(--spacing-xs) var(--spacing-md);
            background-color: var(--surface-1);
            border-bottom: 1px solid var(--divider);
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
            flex-wrap: wrap;
            gap: var(--spacing-xs);
            transition: background-color var(--transition-normal);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .toolbar::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            padding: 0 var(--spacing-xs);
            background-color: var(--card);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-sm);
            transition: transform var(--transition-fast), box-shadow var(--transition-fast);
        }

        .tool-group:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .tool-divider {
            width: 1px;
            height: 24px;
            background-color: var(--divider);
            margin: 0 var(--spacing-xs);
            transition: background-color var(--transition-normal);
        }

        /* Modern, minimal buttons - enhanced */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: none;
            color: var(--text-secondary);
            border-radius: var(--border-radius-sm);
            width: 36px;
            height: 36px;
            cursor: pointer;
            transition: all var(--transition-fast);
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: var(--primary);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1) translate(-50%, -50%);
            transform-origin: 50% 50%;
        }

        .btn:hover {
            background-color: var(--surface-1);
            color: var(--text-primary);
        }

        .btn:active::after {
            animation: ripple 0.6s ease-out;
        }

        @keyframes ripple {
            0% {
                opacity: 0.7;
            }
            100% {
                transform: scale(20) translate(-50%, -50%);
                opacity: 0;
            }
        }

        [data-theme="dark"] .btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .btn:active {
            background-color: var(--surface-2);
        }

        [data-theme="dark"] .btn:active {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .btn.primary {
            background-color: var(--primary);
            color: white;
        }

        .btn.primary:hover {
            background-color: var(--primary-dark);
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn.primary:active {
            transform: translateY(0);
        }

        .btn i {
            font-size: 16px;
        }

        .btn .tooltip {
            position: absolute;
            top: calc(100% + 5px);
            right: 50%;
            transform: translateX(50%);
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--border-radius-sm);
            background-color: var(--card);
            color: var(--text-primary);
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            box-shadow: var(--shadow-md);
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-fast), visibility var(--transition-fast);
            z-index: 10;
            pointer-events: none;
            border: 1px solid var(--border);
        }

        .btn:hover .tooltip {
            opacity: 1;
            visibility: visible;
        }

        /* Main content area - enhanced */
        .content-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            background-color: var(--background);
            transition: all var(--transition-normal);
        }

        /* Editor and preview panels - enhanced */
        .editor-panel, .preview-panel {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex: 1;
            transition: all var(--transition-normal);
        }

        .editor-panel {
            max-width: var(--editor-width);
        }

        .preview-panel {
            max-width: var(--preview-width);
        }

        [data-view-mode="editor-only"] .editor-panel {
            max-width: 100%;
        }

        [data-view-mode="editor-only"] .preview-panel {
            max-width: 0;
            display: none;
        }

        [data-view-mode="preview-only"] .editor-panel {
            max-width: 0;
            display: none;
        }

        [data-view-mode="preview-only"] .preview-panel {
            max-width: 100%;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-sm) var(--spacing-lg);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background-color: var(--surface-1);
            border-bottom: 1px solid var(--divider);
        }

        .panel-header i {
            margin-left: 6px;
            color: var(--primary);
        }

        .panel-content {
            flex: 1;
            overflow: auto;
            position: relative;
        }

        .editor-container {
            height: 100%;
            position: relative;
        }

        .divider {
            width: 1px;
            background-color: var(--divider);
            transition: background-color var(--transition-normal);
            flex-shrink: 0;
        }

        /* Modern CodeMirror styling - enhanced */
        .CodeMirror {
            height: 100% !important;
            direction: rtl;
            font-family: var(--font-mono);
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--card);
            transition: background-color var(--transition-normal), color var(--transition-normal);
            z-index: 1;
            padding: var(--spacing-md);
        }

        /* Special styling for code blocks to switch direction */
        .CodeMirror .cm-comment {
            direction: ltr !important;
            text-align: left !important;
        }

         .CodeMirror-line * {
         padding-right: unset !important;
         }


        .CodeMirror-linenumber {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            padding: 0 var(--spacing-xs);
        }

        /* Special styling for math blocks to switch direction */
        .CodeMirror .cm-math-block,
        .CodeMirror .cm-math-inline,
        .CodeMirror span[class*="cm-math"] {
            direction: ltr !important;
            text-align: left !important;
        }

        /* Ensure all $ and $$ markers are also LTR */
        .CodeMirror .cm-formatting-math {
            direction: ltr !important;
            text-align: left !important;
        }

        /* Need to add ltr to lines containing math */
        .CodeMirror-line:has(.cm-math-block),
        .CodeMirror-line:has(.cm-math-inline) {
            direction: ltr !important;
        }

                .CodeMirror-line:has(.cm-comment),
        .CodeMirror-line:has(.cm-comment) {
            direction: ltr !important;
        }



        /* Target only code blocks within that specific path */
        body > div.app-container > div.content-container > div.editor-panel > div.panel-content > div > div > div.CodeMirror-scroll > div.CodeMirror-sizer > div > div > div > div.CodeMirror-code.CodeMirror-rtl > div:has(.cm-comment),
        body > div.app-container > div.content-container > div.editor-panel > div.panel-content > div > div > div.CodeMirror-scroll > div.CodeMirror-sizer > div > div > div > div.CodeMirror-code.CodeMirror-rtl > div:has(.cm-formatting-code-block) {
            direction: ltr !important;
            text-align: left !important;
        }

        .CodeMirror-rtl pre {
            direction: unset;
        }

        /* Preview content styling - enhanced */
        .preview-content {
            padding: var(--spacing-2xl);
            color: var(--text-primary);
            direction: rtl;
            font-family: var(--font-family);
            line-height: 1.6;
            max-width: 900px;
            margin: 0 auto;
        }

        .preview-content h1,
        .preview-content h2,
        .preview-content h3,
        .preview-content h4,
        .preview-content h5,
        .preview-content h6 {
            margin-top: 1.5em;
            margin-bottom: 0.75em;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .preview-content h1 {
            font-size: 2.5rem;
            border-bottom: 1px solid var(--divider);
            padding-bottom: 0.3em;
            margin-top: 0.8em;
        }

        .preview-content h2 {
            font-size: 1.75rem;
            border-bottom: 1px solid var(--divider);
            padding-bottom: 0.3em;

        document.addEventListener('DOMContentLoaded', function() {
            // Hide loading spinner when page is loaded
            const loadingElement = document.getElementById('loading');
            loadingElement.style.display = 'none';

            // Simple markdown mode that tags code and math sections with more specific classes
            CodeMirror.defineMode("markdownWithCodeMath", function(config) {
                // Get the underlying markdown mode
                const markdownMode = CodeMirror.getMode(config, "markdown");

                // Create an overlay that catches code and math
                const overlay = {
                    startState: function() {
                        return {
                            inCodeBlock: false,
                            inMathBlock: false,
                            inMath: false
                        };
                    },
                    token: function(stream, state) {
                        // Code blocks
                        if (stream.match(/^```/)) {
                            state.inCodeBlock = !state.inCodeBlock;
                            return "comment";
                        }

                        if (state.inCodeBlock) {
                            stream.skipToEnd();
                            return "comment";
                        }

                        // Math blocks
                        if (stream.match(/^\$\$/)) {
                            state.inMathBlock = !state.inMathBlock;
                            return state.inMathBlock ? "math-block formatting-math" : "math-block formatting-math";
                        }

                        if (state.inMathBlock) {
                            stream.skipToEnd();
                            return "math-block";
                        }

                        // Inline math
                        if (stream.match(/^\$/)) {
                            state.inMath = !state.inMath;
                            return state.inMath ? "math-inline formatting-math" : "math-inline formatting-math";
                        }

                        if (state.inMath) {
                            // Look for closing $
                            let match = stream.match(/^[^\$]+\$/, false);
                            if (match) {
                                // Consume up to but not including the closing $
                                stream.match(/^[^\$]+/);
                                return "math-inline";
                            } else {
                                stream.skipToEnd();
                                return "math-inline";
                            }
                        }

                        // If we're not in a special section, skip this token
                        stream.skipToEnd();
                        return null;
                    }
                };

                return CodeMirror.overlayMode(markdownMode, overlay);
            });

            // Define available editor themes
            const editorThemes = {
                'default': {
                    theme: 'default',
                    isDark: false
                },
                'material': {
                    theme: 'material',
                    isDark: true
                },
                'dracula': {
                    theme: 'dracula',
                    isDark: true
                },
                'nord': {
                    theme: 'nord',
                    isDark: true
                },
                'solarized': {
                    theme: 'solarized',
                    isDark: false
                },
                'ayu-dark': {
                    theme: 'ayu-dark',
                    isDark: true
                },

                    isDark: false
                },

                    theme: 'xq-light',
                    isDark: false

                    isDark: false,
                    isAuto: true

            // Initialize state variables

            let isDarkMode = localStorage.getItem('darkMode') === 'enabled';
            let currentViewMode = localStorage.getItem('viewMode') || 'split';

            const editor = CodeMirror.fromTextArea(document.getElementById('editor'), {

                extraKeys: {

                    'Ctrl-I': function(cm) { insertMarkdown(cm, 'italic'); },

                    'Ctrl-S': function(cm) { saveDocument(); }
                }
            });

            // Function to get the correct editor theme based on current settings
            function getEditorTheme() {
                const themeInfo = editorThemes[currentTheme];

                // If auto theme, pick based on dark mode

            // Sample content
            const sampleContent = `# עורך Markdown מודרני

ברוך הבא לעורך Markdown המודרני בעברית. עורך זה תומך בכל תכונות Markdown ובנוסחאות מתמטיות, עם ממשק מינימליסטי בהשראת מוצרי Apple.

## תכונות המערכת

* עיצוב נקי ומודרני בהשראת מוצרי Apple
* תמיכה מלאה בעברית (RTL)
* עיצוב טקסט **מודגש**, *נטוי* ו~~קו חוצה~~
* תמיכה ברשימות ממוספרות ולא ממוספרות
* אפשרות להוספת [קישורים](https://example.com) ותמונות
* תחביר קוד עם הדגשת תחביר
* מצב כהה ובהיר עם מגוון ערכות נושא לעורך

## תמיכה בנוסחאות מתמטיות

ניתן להשתמש בנוסחאות מתמטיות בתוך השורה כמו $E = mc^2$ או בתור בלוק:

$$

            editor.setValue(sampleContent);

            // Configure Marked renderer for RTL
            const renderer = new marked.Renderer();

            // Custom table renderer for RTL tables
            renderer.table = function(header, body) {
                return `<table class="rtl-table" dir="rtl">\n<thead>\n${header}</thead>\n<tbody>\n${body}</tbody>\n</table>\n`;
            };

            // Custom list renderer for RTL lists
            renderer.list = function(body, ordered, start) {
                const type = ordered ? 'ol' : 'ul';
                const startAttr = (ordered && start && start !== 1) ? ` start="${start}"` : '';
                return `<${type}${startAttr} dir="rtl">${body}</${type}>`;
            };

            // Custom list item renderer for RTL
            renderer.listitem = function(text, task, checked) {
                if (task) {
                    return `<li style="direction: rtl; text-align: right;"><input type="checkbox" ${checked ? 'checked' : ''} disabled> <span>${text}</span></li>`;
                }
                return `<li style="direction: rtl; text-align: right;">${text}</li>`;
            };

            // Custom code block renderer to ensure LTR
            renderer.code = function(code, infostring, escaped) {
                const lang = (infostring || '').match(/\S*/)[0];

                // Add explicit LTR direction to code blocks
                return `<pre dir="ltr" style="direction: ltr; text-align: left;"><code class="language-${lang}">${escaped ? code : escape(code)}</code></pre>`;
            };

            // Custom inline code renderer
            renderer.codespan = function(code) {
                return `<code dir="ltr" style="direction: ltr;">${code}</code>`;
            };

            // Setup Marked
            marked.setOptions({
                renderer: renderer,
                headerIds: true,
                gfm: true,
                breaks: false,
                pedantic: false,
                sanitize: false,
                smartLists: true,
                smartypants: false,
                xhtml: false
            });

            // Helper function to escape HTML
            function escape(html) {
                return html
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            // Function to process math expressions
            function processMath(text) {
                // Replace block math
                text = text.replace(/\$\$([\s\S]*?)\$\$/g, function(match, equation) {
                    try {
                        return `<div class="katex-display" dir="ltr">${katex.renderToString(equation, { displayMode: true, throwOnError: false })}</div>`;
                    } catch (error) {
                        return `<div class="katex-error">Error in equation: ${error.message}</div>`;
                    }
                });

                // Replace inline math
                text = text.replace(/\$((?!\$)[\s\S]*?)\$/g, function(match, equation) {
                    try {
                        return `<span dir="ltr" style="display: inline-block;">${katex.renderToString(equation, { displayMode: false, throwOnError: false })}</span>`;
                    } catch (error) {
                        return `<span class="katex-error">Error in equation: ${error.message}</span>`;
                    }
                });

                return text;
            }

            // Function to update preview
            function updatePreview() {
                const markdown = editor.getValue();

                // First parse markdown
                let html = marked.parse(markdown);

                // Then process math expressions
                html = processMath(html);

                // Sanitize HTML
                const sanitizedHtml = DOMPurify.sanitize(html, {
                    ADD_TAGS: ['math', 'mrow', 'mi', 'mo', 'mn', 'msup', 'msub', 'mfrac'],
                    ADD_ATTR: ['display', 'dir', 'style']
                });

                // Update preview
                document.getElementById('preview').innerHTML = sanitizedHtml;

                // Update document stats
                updateStats(markdown);
            }

            // Function to update document stats
            function updateStats(text) {
                const words = text.trim().split(/\s+/).filter(word => word.length > 0).length;
                const chars = text.length;
                const cursor = editor.getCursor();

                document.getElementById('stats').innerHTML = `<i class="fa-solid fa-chart-simple"></i> ${words} מילים | ${chars} תווים`;
                document.getElementById('cursor-position').innerHTML = `<i class="fa-solid fa-location-dot"></i> שורה ${cursor.line + 1}, עמודה ${cursor.ch + 1}`;
            }

            // Function to insert markdown syntax
            function insertMarkdown(cm, type) {
                const selection = cm.getSelection();
                let replacement = '';

                switch (type) {
                    case 'bold':
                        replacement = `**${selection || 'טקסט מודגש'}**`;
                        break;
                    case 'italic':
                        replacement = `*${selection || 'טקסט נטוי'}*`;
                        break;
                    case 'strikethrough':
                        replacement = `~~${selection || 'טקסט עם קו חוצה'}~~`;
                        break;
                    case 'heading1':
                        replacement = `# ${selection || 'כותרת ראשית'}`;
                        break;
                    case 'heading2':
                        replacement = `## ${selection || 'כותרת משנית'}`;
                        break;
                    case 'heading3':
                        replacement = `### ${selection || 'כותרת שלישית'}`;
                        break;
                    case 'link':
                        replacement = `[${selection || 'טקסט קישור'}](http://example.com)`;
                        break;
                    case 'image':
                        replacement = `![${selection || 'תיאור תמונה'}](http://example.com/image.jpg)`;
                        break;
                    case 'code':
                        replacement = selection ? `\`${selection}\`` : "```\nקוד כאן\n```";
                        break;
                    case 'blockquote':
                        replacement = `> ${selection || 'ציטוט'}`;
                        break;
                    case 'bulletList':
                        replacement = `* ${selection || 'פריט ברשימה'}`;
                        break;
                    case 'numberedList':
                        replacement = `1. ${selection || 'פריט ברשימה'}`;
                        break;
                    case 'taskList':
                        replacement = `- [ ] ${selection || 'משימה לביצוע'}`;
                        break;
                    case 'inlineMath':
                        replacement = `$${selection || 'E = mc^2'}$`;
                        break;
                    case 'blockMath':
                        replacement = `$$\n${selection || '\\sum_{i=1}^{n} i = \\frac{n(n+1)}{2}'}\n$$`;
                        break;
                    case 'table':
                        replacement = `| כותרת 1 | כותרת 2 | כותרת 3 |\n| ------- | ------- | ------- |\n| תוכן 1  | תוכן 2  | תוכן 3  |\n| תוכן 4  | תוכן 5  | תוכן 6  |`;
                        break;
                    default:
                        replacement = selection;
                }

                cm.replaceSelection(replacement);
                updatePreview();
            }

            // Function to set the view mode
            function setViewMode(mode) {
                const appContainer = document.querySelector('.app-container');
                const viewBtns = document.querySelectorAll('.view-mode-btn');

                // Update container data attribute
                appContainer.setAttribute('data-view-mode', mode);

                // Update active button
                viewBtns.forEach(btn => {
                    if (btn.getAttribute('data-mode') === mode) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });

                // Store in localStorage
                localStorage.setItem('viewMode', mode);
                currentViewMode = mode;

                // Refresh editor when switching view modes
                setTimeout(() => {
                    editor.refresh();
                    updatePreview();
                }, 100);
            }

            // Function to set dark mode
            function setDarkMode(enabled) {
                const themeToggle = document.getElementById('theme-toggle');

                // Update dark mode state
                isDarkMode = enabled;

                // Update toggle visual state
                themeToggle.setAttribute('data-active', enabled);
                themeToggle.setAttribute('aria-pressed', enabled);

                // Set body data-theme attribute
                if (enabled) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('darkMode', 'enabled');
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.removeItem('darkMode');
                }

                // Update editor theme if using auto theme
                if (editorThemes[currentTheme].isAuto) {
                    editor.setOption('theme', getEditorTheme());
                }
            }

            // Function to set editor theme
            function setEditorTheme(themeName) {
                if (!editorThemes[themeName]) return;

                // Update active theme
                currentTheme = themeName;

                // Update editor theme
                editor.setOption('theme', getEditorTheme());

                // Store in localStorage
                localStorage.setItem('editorTheme', themeName);

                // Update theme option UI
                document.querySelectorAll('.theme-option').forEach(option => {
                    if (option.getAttribute('data-theme') === themeName) {
                        option.classList.add('active');
                    } else {
                        option.classList.remove('active');
                    }
                });
            }

            // Add event listeners to toolbar buttons
            document.querySelectorAll('.btn[data-command]').forEach(button => {
                button.addEventListener('click', function() {
                    const command = this.getAttribute('data-command');
                    insertMarkdown(editor, command);
                    editor.focus();
                });
            });

            // View mode buttons
            document.querySelectorAll('.view-mode-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const mode = this.getAttribute('data-mode');
                    setViewMode(mode);
                });
            });

            // Theme dropdown toggle
            const themeBtn = document.getElementById('theme-select-btn');
            const themeSelector = document.querySelector('.theme-selector');

            themeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                themeSelector.classList.toggle('open');
            });

            // Close theme dropdown when clicking outside
            document.addEventListener('click', function(e) {
                if (!themeSelector.contains(e.target)) {
                    themeSelector.classList.remove('open');
                }
            });

            // Theme options
            document.querySelectorAll('.theme-option').forEach(option => {
                option.addEventListener('click', function() {
                    const theme = this.getAttribute('data-theme');
                    setEditorTheme(theme);
                    themeSelector.classList.remove('open');
                });
            });

            // Set active theme option
            document.querySelectorAll('.theme-option').forEach(option => {
                if (option.getAttribute('data-theme') === currentTheme) {
                    option.classList.add('active');
                } else {
                    option.classList.remove('active');
                }
            });

            // Clear button
            document.getElementById('clear-btn').addEventListener('click', function() {
                if (confirm('האם אתה בטוח שברצונך לנקות את כל התוכן?')) {
                    editor.setValue('');
                    editor.focus();
                }
            });

            // Save button
            document.getElementById('save-btn').addEventListener('click', saveDocument);

            function saveDocument() {
                const content = editor.getValue();
                const filename = 'markdown_document.md';

                const blob = new Blob([content], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();

                URL.revokeObjectURL(url);
            }

            // Dark mode toggle
            const themeToggle = document.getElementById('theme-toggle');

            themeToggle.addEventListener('click', function() {
                const isActive = this.getAttribute('data-active') === 'true';
                setDarkMode(!isActive);
            });

            // Keyboard navigation for toggle
            themeToggle.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            // Check for saved theme preference
            if (localStorage.getItem('darkMode') === 'enabled') {
                setDarkMode(true);
            }

            // Update preview and stats when editor changes
            editor.on('change', updatePreview);
            editor.on('cursorActivity', function() {
                updateStats(editor.getValue());
            });

            // Handle window resize events to make the editor responsive
            window.addEventListener('resize', function() {
                editor.refresh();
            });

            // Initial update
            updatePreview();
        });
    </script>
